/* ============================================================================
   APOMETRIA APP — Protótipo Fase 0
   01-estilo.css · design system
   Paleta, tipografia e materiais vindos do arquivo 05 do briefing.
   A ordem importa: tokens → reset → moldura → materiais → componentes → telas.
   ========================================================================= */

/* ---------------------------------------------------------------- 1. TOKENS */
:root {
  /* Paleta — arquivo 05, sem desvio */
  --violeta:        #5B3E8E;
  --violeta-fundo:  #E8DFF6;
  --dourado:        #C9A24B;
  --fundo:          #FBF8F4;
  --superficie:     #FFFFFF;
  --texto:          #2B2140;
  /* O arquivo 05 pede #7A7290, mas ele dá 4.28:1 sobre o fundo — abaixo do
     AA (4.5) que o MESMO arquivo exige na seção de acessibilidade. Escurecido
     4 pontos: 4.70:1, e a olho nu continua o mesmo cinza-lavanda. */
  --texto-2:        #736C86;
  --sucesso:        #5E9A7A;
  --alerta:         #C46A4A;

  /* Derivados (calculados a partir dos nove acima — nenhuma cor solta) */
  --violeta-escuro: #432C6B;
  --violeta-claro:  #7B60AC;
  --violeta-12:     rgba(91, 62, 142, 0.12);
  --violeta-08:     rgba(91, 62, 142, 0.08);
  --texto-3:        #8F87A4;   /* só decoração e ícone: 3.2:1, o mínimo para não-texto */
  --linha:          rgba(43, 33, 64, 0.09);
  --linha-forte:    rgba(43, 33, 64, 0.16);
  --sucesso-fundo:  #E4F0EA;
  --alerta-fundo:   #F8E7E0;
  --dourado-fundo:  #F6EEDC;

  /* Mapa (tons dessaturados para o pin violeta saltar) */
  --mapa-solo:      #EDE8E1;
  --mapa-rua:       #FDFCFA;
  --mapa-via:       #FFFFFF;
  --mapa-parque:    #DCE7DC;
  --mapa-agua:      #D6E3EC;
  --mapa-quadra:    #F5F1EB;

  /* Raios — cantos bem arredondados (16–24px, arquivo 05) */
  --r-p: 12px;
  --r-m: 18px;
  --r-g: 24px;
  --r-xg: 32px;
  --r-pilula: 999px;

  /* Sombras suaves, em camadas */
  --sombra-1: 0 1px 2px rgba(43, 33, 64, 0.05), 0 2px 8px rgba(43, 33, 64, 0.04);
  --sombra-2: 0 2px 6px rgba(43, 33, 64, 0.06), 0 8px 24px rgba(43, 33, 64, 0.08);
  --sombra-3: 0 4px 12px rgba(43, 33, 64, 0.08), 0 18px 48px rgba(43, 33, 64, 0.14);
  --sombra-pin: 0 3px 8px rgba(43, 33, 64, 0.28);

  /* Escala de texto — respeita o ajuste do sistema (Dynamic Type) */
  --escala: 1;

  /* Superfícies translúcidas (material flutuante) */
  --vidro:        rgba(255, 255, 255, 0.72);
  --vidro-borda:  rgba(255, 255, 255, 0.65);
  --vidro-blur:   blur(24px) saturate(180%);

  --altura-tab: 62px;
}

/* Fora da moldura: acompanha o tema de quem está olhando.
   Dentro da moldura, a identidade da marca é clara por decisão — arquivo 05. */
:root {
  --palco:        #EFEAE3;
  --palco-texto:  #4A4258;
  --palco-linha:  rgba(43, 33, 64, 0.12);
}
/* Três estados, não dois: quem não escolheu tema não tem atributo nenhum no
   <html>, e só o prefers-color-scheme separa claro de escuro. Quem escolheu
   ganha data-theme, e a escolha tem de vencer o sistema nas DUAS direções. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --palco:       #17141F;
    --palco-texto: #A79FBB;
    --palco-linha: rgba(255, 255, 255, 0.10);
  }
}
:root[data-theme="dark"] {
  --palco:       #17141F;
  --palco-texto: #A79FBB;
  --palco-linha: rgba(255, 255, 255, 0.10);
}

/* ------------------------------------------------------------- 2. RESET LEVE */
* { box-sizing: border-box; }

/* O `[hidden]{display:none}` do navegador perde para qualquer classe que
   defina display (foi assim que a folha "escondida" ficou visível). Uma linha
   aqui resolve a categoria inteira do problema, não um caso. */
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--palco);
  color: var(--texto);
  font-family: "Nunito Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: calc(16px * var(--escala));
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button, input, textarea, select {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  margin: 0;
}
button { cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; }

/* Foco visível só para teclado (a área de toque não ganha anel) */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--violeta);
  outline-offset: 2px;
  border-radius: 6px;
}

/* --------------------------------------------------------- 3. TIPOGRAFIA */
/* Tracking é específico do tamanho: títulos grandes fecham, texto pequeno abre. */
.serif { font-family: "Fraunces", ui-serif, Georgia, "Times New Roman", serif; }

.d1 { font-family: "Fraunces", ui-serif, Georgia, serif; font-size: 2.15rem; line-height: 1.08; letter-spacing: -0.022em; font-weight: 600; font-optical-sizing: auto; }
.d2 { font-family: "Fraunces", ui-serif, Georgia, serif; font-size: 1.6rem;  line-height: 1.14; letter-spacing: -0.016em; font-weight: 600; font-optical-sizing: auto; }
.d3 { font-family: "Fraunces", ui-serif, Georgia, serif; font-size: 1.24rem; line-height: 1.2;  letter-spacing: -0.010em; font-weight: 600; font-optical-sizing: auto; }

.t1 { font-size: 1.06rem; line-height: 1.35; font-weight: 700; letter-spacing: -0.004em; }
.t2 { font-size: 0.95rem; line-height: 1.4;  font-weight: 700; letter-spacing: 0; }
.corpo  { font-size: 0.95rem;  line-height: 1.55; }
.pequeno{ font-size: 0.84rem;  line-height: 1.45; letter-spacing: 0.004em; }
.micro  { font-size: 0.735rem; line-height: 1.35; letter-spacing: 0.018em; font-weight: 700; text-transform: uppercase; }

.dim  { color: var(--texto-2); }
.dim2 { color: var(--texto-3); }
.tab-num { font-variant-numeric: tabular-nums; }
.equilibra { text-wrap: balance; }

/* ---------------------------------------------------------- 4. O PALCO */
.palco {
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1fr;
  place-items: center;
  gap: 22px;
  padding: 24px;
}
.legenda-palco {
  color: var(--palco-texto);
  text-align: center;
  max-width: 66ch;
  font-size: 0.83rem;
  line-height: 1.5;
}
.legenda-palco b { color: var(--palco-texto); }
.legenda-palco kbd {
  font: inherit; font-size: 0.94em; font-weight: 700;
  border: 1px solid var(--palco-linha);
  border-radius: 6px; padding: 1px 6px;
}

/* A moldura de celular */
.moldura {
  position: relative;
  width: 392px;
  height: 844px;
  max-height: calc(100dvh - 156px);
  border-radius: 46px;
  padding: 11px;
  background: linear-gradient(160deg, #3a3448, #191521 42%, #2c2738);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.09) inset,
    0 30px 70px rgba(20, 14, 34, 0.34),
    0 6px 18px rgba(20, 14, 34, 0.22);
  flex: none;
}

/* Em celular de verdade o app ocupa a tela toda — nada de moldura dentro de moldura */
@media (max-width: 520px), (max-height: 700px) {
  .palco { padding: 0; gap: 0; place-items: stretch; }
  .moldura { width: 100%; height: 100vh; height: 100dvh; max-height: none; border-radius: 0; padding: 0; box-shadow: none; }
  .app { border-radius: 0; }
  .legenda-palco { display: none; }
}

/* --------------------------------------------------------- 5. A TELA (app) */
.app {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 36px;
  overflow: hidden;
  background: var(--fundo);
  isolation: isolate;
  /* área segura: notch em cima, barra de gestos embaixo */
  --topo: 44px;
  --base: 22px;
}
/* `--st` / `--sb` são preenchidas pelo app Android com as medidas REAIS do
   recorte; no navegador ficam indefinidas e o `env()` assume. Um valor só não
   serve para os dois: o WebView nem sempre reporta `env()`, e o navegador não
   tem quem lhe diga o tamanho da barra. */
@media (max-width: 520px), (max-height: 700px) {
  .app {
    --topo: max(20px, var(--st, env(safe-area-inset-top)));
    --base: max(14px, var(--sb, env(safe-area-inset-bottom)));
  }
}

/* Barra de status simulada */
.status {
  position: absolute; inset: 0 0 auto 0; height: var(--topo);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 26px; z-index: 80; pointer-events: none;
  font-size: 0.78rem; font-weight: 800; letter-spacing: 0.01em;
  color: var(--texto);
  mix-blend-mode: multiply;
}
.status--claro { color: #fff; mix-blend-mode: normal; }
.status .sinais { display: flex; align-items: center; gap: 5px; }
.status .bateria {
  width: 22px; height: 11px; border: 1.4px solid currentColor; border-radius: 3px;
  position: relative; opacity: 0.9;
}
.status .bateria::after { content: ""; position: absolute; inset: 1.6px; right: 5px; background: currentColor; border-radius: 1px; }
.status .bateria::before { content: ""; position: absolute; right: -3.4px; top: 3px; width: 2px; height: 5px; background: currentColor; border-radius: 0 2px 2px 0; }

/* Notch */
.notch {
  position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
  width: 116px; height: 30px; border-radius: 999px; background: #12101a; z-index: 90;
}
@media (max-width: 520px), (max-height: 700px) { .notch { display: none; } .status { display: none; } .app { --topo: max(12px, var(--st, env(safe-area-inset-top))); } }

/* Faixa invisível na borda esquerda: é por onde se puxa a tela de volta.
   Precisa de touch-action:none, senão o navegador rola em vez de deixar
   o gesto acontecer. */
.borda-voltar {
  position: absolute; left: 0; top: 0; bottom: 0; width: 26px; z-index: 70;
  touch-action: none; background: transparent;
}

/* Barra de gestos */
.barra-gesto {
  position: absolute; bottom: 7px; left: 50%; transform: translateX(-50%);
  width: 126px; height: 4.5px; border-radius: 999px; background: rgba(43, 33, 64, 0.24); z-index: 95; pointer-events: none;
}

/* ----------------------------------------------------- 6. PILHA DE TELAS */
.pilha { position: absolute; inset: 0; }
.tela {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  background: var(--fundo);
  will-change: transform;
  contain: layout paint;
}
.tela--raiz { background: transparent; }
/* O container das abas PRECISA continuar a cadeia flex. Sem isto o `.rolar`
   de dentro não recebe altura, não rola, e o conteúdo é simplesmente cortado
   pelo overflow do app — Favoritas e Minha conta ficavam sem fim de página. */
.raiz__conteudo {
  flex: 1 1 auto; min-height: 0;
  display: flex; flex-direction: column;
  position: relative;
}
/* véu que escurece a tela de trás enquanto a de cima entra */
.tela__veu {
  position: absolute; inset: 0; background: #17111f; opacity: 0; pointer-events: none; z-index: 60;
}
/* borda esquerda ganha uma sombra conforme a tela desliza */
.tela--empilhada { box-shadow: -14px 0 34px rgba(24, 17, 38, 0.16); }

/* Rolagem interna */
.rolar {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scrollbar-width: none;
}
.rolar::-webkit-scrollbar { width: 0; height: 0; }

/* --------------------------------------------------- 7. MATERIAIS (vidro) */
.vidro {
  background: var(--vidro);
  -webkit-backdrop-filter: var(--vidro-blur);
  backdrop-filter: var(--vidro-blur);
}
/* Superfície maior = material mais espesso (borrão maior, sombra mais funda) */
.vidro--espesso {
  background: rgba(255, 255, 255, 0.80);
  -webkit-backdrop-filter: blur(34px) saturate(190%);
  backdrop-filter: blur(34px) saturate(190%);
}
/* aresta clara no topo: a luz batendo no material */
.aresta-topo { border-top: 1px solid var(--vidro-borda); }

/* Cabeçalho flutuante com desvanecimento na borda, no lugar de um filete de 1px */
.cabecalho {
  position: relative; z-index: 40; flex: none;
  padding: calc(var(--topo) + 6px) 18px 12px;
}
.cabecalho--vidro { background: var(--vidro); -webkit-backdrop-filter: var(--vidro-blur); backdrop-filter: var(--vidro-blur); }
.cabecalho--vidro::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -22px; height: 22px;
  background: linear-gradient(to bottom, rgba(251, 248, 244, 0.85), rgba(251, 248, 244, 0));
  pointer-events: none;
}
.cabecalho__linha { display: flex; align-items: center; gap: 10px; min-height: 40px; }
.cabecalho__titulo { flex: 1 1 auto; min-width: 0; }

/* --------------------------------------------------------- 8. BOTÕES */
/* A resposta acontece no toque (pointerdown), não na soltura. */
.btn {
  --btn-bg: var(--violeta);
  --btn-fg: #fff;
  display: inline-flex; align-items: center; justify-content: center; gap: 9px;
  min-height: 52px; padding: 0 22px;
  border-radius: var(--r-m);
  background: var(--btn-bg); color: var(--btn-fg);
  font-weight: 800; font-size: 1rem; letter-spacing: -0.002em;
  transform: scale(1);
  transition: transform 120ms cubic-bezier(.22,.61,.36,1), opacity 120ms linear, background-color 140ms linear;
  user-select: none; -webkit-user-select: none;
  text-align: center;
}
.btn:disabled { opacity: 0.42; }
.btn.pressionado:not(:disabled) { transform: scale(0.965); }
.btn--bloco { display: flex; width: 100%; }
.btn--secundario { --btn-bg: var(--violeta-fundo); --btn-fg: var(--violeta-escuro); }
.btn--contorno { --btn-bg: transparent; --btn-fg: var(--texto); box-shadow: inset 0 0 0 1.5px var(--linha-forte); }
.btn--fantasma { --btn-bg: transparent; --btn-fg: var(--violeta); min-height: 44px; }
.btn--zap { --btn-bg: #1FA855; --btn-fg: #fff; }
.btn--perigo { --btn-bg: transparent; --btn-fg: var(--alerta); box-shadow: inset 0 0 0 1.5px rgba(196, 106, 74, 0.4); }
.btn--pequeno { min-height: 40px; padding: 0 15px; font-size: 0.88rem; border-radius: var(--r-p); }

/* Botão redondo (voltar, fechar, alternar) — área de toque ≥ 44px */
.redondo {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border-radius: 50%;
  background: var(--superficie); color: var(--texto);
  box-shadow: var(--sombra-1);
  transition: transform 120ms cubic-bezier(.22,.61,.36,1), background-color 140ms linear;
}
.redondo.pressionado { transform: scale(0.9); }
.redondo--vidro { background: var(--vidro); -webkit-backdrop-filter: var(--vidro-blur); backdrop-filter: var(--vidro-blur); }
.redondo--nu { background: transparent; box-shadow: none; }

/* --------------------------------------------------------- 9. CHIPS */
.chips {
  display: flex; gap: 8px; overflow-x: auto; padding: 2px 18px 2px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  scroll-padding-inline: 18px;
}
.chips::-webkit-scrollbar { width: 0; height: 0; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 38px; padding: 0 15px;
  border-radius: var(--r-pilula);
  background: var(--superficie); color: var(--texto);
  box-shadow: var(--sombra-1);
  font-size: 0.87rem; font-weight: 700; white-space: nowrap;
  transition: transform 120ms cubic-bezier(.22,.61,.36,1), background-color 160ms linear, color 160ms linear;
}
.chip.pressionado { transform: scale(0.94); }
.chip[aria-pressed="true"] { background: var(--violeta); color: #fff; box-shadow: 0 3px 10px rgba(91, 62, 142, 0.3); }
.chip__conta {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
  background: var(--violeta); color: #fff; font-size: 0.68rem; font-weight: 800;
  display: grid; place-items: center;
}
.chip[aria-pressed="true"] .chip__conta { background: rgba(255, 255, 255, 0.28); }

/* Etiqueta estática (terapias no perfil) */
.etiqueta {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; border-radius: var(--r-pilula);
  background: var(--violeta-fundo); color: var(--violeta-escuro);
  font-size: 0.79rem; font-weight: 800; white-space: nowrap;
}
.etiqueta--aberta { background: var(--sucesso-fundo); color: #37624E; }
.etiqueta--fechada { background: var(--alerta-fundo); color: #9A4C31; }
.etiqueta--verificada { background: var(--dourado-fundo); color: #7C6221; }
.etiqueta--online { background: #E2ECF4; color: #38566B; }

/* ------------------------------------------------------ 10. CARTÕES */
.cartao {
  background: var(--superficie);
  border-radius: var(--r-g);
  box-shadow: var(--sombra-1);
  padding: 16px;
}
.cartao--plano { box-shadow: none; border: 1px solid var(--linha); }
.secao { padding: 18px; }
.secao__titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 11px; }
.divisor { height: 1px; background: var(--linha); margin: 4px 18px; }
.empilhado { display: flex; flex-direction: column; }
.linha { display: flex; align-items: center; gap: 12px; }
.entre { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* Avatar */
.avatar {
  border-radius: 50%; overflow: hidden; flex: none;
  background: var(--violeta-fundo);
  display: grid; place-items: center;
  position: relative;
}
.avatar svg { width: 100%; height: 100%; }

/* Estrelas */
.estrelas { display: inline-flex; align-items: center; gap: 1.5px; color: var(--dourado); }
.estrelas svg { width: 15px; height: 15px; }
.estrelas--g svg { width: 21px; height: 21px; }

/* --------------------------------------------------- 11. CAMPOS DE TEXTO */
.campo { display: block; margin-bottom: 15px; }
.campo__rot { display: block; font-size: 0.82rem; font-weight: 800; color: var(--texto-2); margin-bottom: 6px; letter-spacing: 0.01em; }
.campo__cx {
  display: flex; align-items: center; gap: 9px;
  min-height: 52px; padding: 0 15px;
  background: var(--superficie); border-radius: var(--r-m);
  box-shadow: inset 0 0 0 1.5px var(--linha);
  transition: box-shadow 160ms ease;
}
.campo__cx:focus-within { box-shadow: inset 0 0 0 2px var(--violeta); }
.campo__cx input, .campo__cx textarea {
  flex: 1 1 auto; min-width: 0; width: 100%;
  /* 16px evita o zoom automático do iOS ao focar */
  font-size: max(16px, 0.98rem);
  padding: 14px 0;
  resize: none;
}
.campo__cx textarea { line-height: 1.5; }
.campo__cx input::placeholder, .campo__cx textarea::placeholder { color: var(--texto-3); }
.campo__ajuda { font-size: 0.78rem; color: var(--texto-2); margin-top: 6px; }
.campo__erro { font-size: 0.78rem; color: var(--alerta); margin-top: 6px; font-weight: 700; }
.campo--erro .campo__cx { box-shadow: inset 0 0 0 2px var(--alerta); }

/* Chave liga/desliga */
.chave {
  width: 51px; height: 31px; border-radius: 999px; flex: none;
  background: var(--linha-forte); position: relative;
  transition: background-color 220ms cubic-bezier(.22,.61,.36,1);
}
.chave::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px;
  border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
  transition: transform 260ms cubic-bezier(.3,1.3,.5,1);
}
.chave[aria-checked="true"] { background: var(--sucesso); }
.chave[aria-checked="true"]::after { transform: translateX(20px); }

/* -------------------------------------------------------- 12. O MAPA */
.mapa {
  position: absolute; inset: 0;
  overflow: hidden;
  background: var(--mapa-solo);
  touch-action: none;
  cursor: grab;
}
.mapa.arrastando { cursor: grabbing; }
.mapa__mundo {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  will-change: transform;
}
.mapa__svg { position: absolute; top: 0; left: 0; }

/* Pin — o tamanho não muda com o zoom (contra-escala pela var --z) */
.pin {
  position: absolute;
  width: 46px; height: 56px;
  margin: -56px 0 0 -23px;   /* ponta do pin no ponto exato */
  transform: scale(calc(1 / var(--z, 1)));
  transform-origin: 50% 100%;
  will-change: transform;
  filter: drop-shadow(0 3px 6px rgba(43, 33, 64, 0.3));
}
.pin__corpo { transition: transform 260ms cubic-bezier(.3,1.25,.5,1); transform-origin: 50% 100%; }
.pin[data-sel="1"] { z-index: 5; }
.pin[data-sel="1"] .pin__corpo { transform: scale(1.22); }
.pin__anel {
  position: absolute; left: 50%; bottom: -6px; width: 20px; height: 8px;
  margin-left: -10px; border-radius: 50%;
  background: rgba(91, 62, 142, 0.28);
  opacity: 0; transform: scale(0.6);
}
.pin[data-sel="1"] .pin__anel { animation: pulso 1.9s ease-out infinite; }
@keyframes pulso {
  0%   { opacity: 0.55; transform: scale(0.6); }
  70%  { opacity: 0;    transform: scale(2.6); }
  100% { opacity: 0;    transform: scale(2.6); }
}
.pin__nota {
  position: absolute; top: 6px; left: 50%; transform: translateX(-50%);
  font-size: 0.66rem; font-weight: 900; color: #fff; letter-spacing: -0.01em;
}
/* Fechada não vira cinza: o mapa perderia a leitura de "onde tem terapeuta".
   Perde saturação e presença, sem sair da paleta. */
.pin--fechada { opacity: 0.62; filter: saturate(0.45) drop-shadow(0 2px 4px rgba(43, 33, 64, 0.22)); }

/* O raio de precisão do GPS. Fica FORA do `.eu` de propósito: o ponto azul
   contra-escala para manter o tamanho na tela, e o raio precisa fazer o
   contrário — ele é uma medida do mundo, em metros, e tem de crescer e encolher
   junto com o zoom. Raio que não acompanha o mapa não mede nada. */
.precisao {
  position: absolute;
  border-radius: 50%;
  background: rgba(44, 123, 229, 0.10);
  border: 1px solid rgba(44, 123, 229, 0.28);
  pointer-events: none;
  display: none;
}
.precisao[data-mostrar="1"] { display: block; }

/* O ponto azul de "você está aqui" */
.eu { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; transform: scale(calc(1 / var(--z, 1))); }
.eu__nucleo { position: absolute; inset: 4px; border-radius: 50%; background: #2C7BE5; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,0.25); }
.eu__halo { position: absolute; inset: -14px; border-radius: 50%; background: rgba(44, 123, 229, 0.16); animation: respira 3.4s ease-in-out infinite; }
@keyframes respira { 0%,100% { transform: scale(0.85); opacity: 0.75; } 50% { transform: scale(1.15); opacity: 0.35; } }

/* Rótulo de bairro no mapa */
.mapa__rotulo {
  position: absolute; transform: translate(-50%, -50%) scale(calc(1 / var(--z, 1)));
  font-size: 0.63rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
  color: #A79FB4; pointer-events: none; white-space: nowrap;
  text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 1px 2px rgba(255,255,255,0.95);
}

/* ---- encaixe do MapLibre (mapa de ruas real) ---- */
/* O crédito de OpenFreeMap/OpenStreetMap é obrigação de licença. Ele fica
   discreto, mas fica: subiu acima da barra de abas para não ser tapado. */
.maplibregl-ctrl-bottom-left,
.maplibregl-ctrl-bottom-right {
  bottom: calc(var(--altura-tab) + var(--base) - 4px);
  z-index: 20;
}
.maplibregl-ctrl-attrib {
  font-size: 0.62rem;
  background: rgba(255, 255, 255, 0.72) !important;
  border-radius: var(--r-pilula) !important;
}
.maplibregl-ctrl-attrib a { color: var(--texto-2); }
/* O logotipo do MapLibre não é exigido pela licença dos dados e rouba espaço
   numa tela de celular; o crédito das FONTES DE DADOS continua. */
.maplibregl-ctrl-logo { display: none; }
.mapa .maplibregl-canvas { outline: none; }

/* Dentro de um marcador do MapLibre o pino não se posiciona sozinho nem
   contra-escala: quem cuida disso é o marcador. */
.maplibregl-marker .pin,
.maplibregl-marker .eu { position: relative; margin: 0; transform: none; }
.maplibregl-marker .pin[data-sel="1"] { z-index: 5; }

/* No mini-mapa o crédito volta para o canto de baixo do próprio quadro */
.minimapa .maplibregl-ctrl-bottom-right { bottom: 0; }
.minimapa .maplibregl-ctrl-attrib { font-size: 0.55rem; }

/* Controles flutuantes sobre o mapa */
.mapa__topo { position: absolute; top: 0; left: 0; right: 0; z-index: 30; padding-top: calc(var(--topo) + 4px); pointer-events: none; }
.mapa__topo > * { pointer-events: auto; }
.busca {
  display: flex; align-items: center; gap: 10px;
  margin: 0 16px 10px; padding: 0 14px; height: 50px;
  border-radius: var(--r-m);
  background: var(--vidro); -webkit-backdrop-filter: var(--vidro-blur); backdrop-filter: var(--vidro-blur);
  box-shadow: var(--sombra-2);
  border: 1px solid var(--vidro-borda);
}
.busca input { flex: 1 1 auto; min-width: 0; font-size: max(16px, 0.95rem); font-weight: 600; }
.flutuantes {
  position: absolute; right: 16px; z-index: 30;
  display: flex; flex-direction: column; gap: 10px;
  will-change: transform;
}
/* Sem este recuo os botões ficam ATRÁS da barra de abas e não dá para tocá-los */
.flutuantes--dir { bottom: calc(var(--altura-tab) + var(--base) + 14px); }

/* ------------------------------------------------- 13. FOLHA (bottom sheet) */
.folha {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
  max-height: calc(100% - var(--topo) - 24px);
  border-radius: var(--r-xg) var(--r-xg) 0 0;
  background: var(--superficie);
  box-shadow: 0 -2px 10px rgba(43, 33, 64, 0.07), 0 -16px 46px rgba(43, 33, 64, 0.16);
  will-change: transform;
  touch-action: none;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.folha__alca { flex: none; padding: 9px 0 4px; display: grid; place-items: center; }
.folha__alca i { display: block; width: 38px; height: 5px; border-radius: 999px; background: var(--linha-forte); }
/* Conteúdo comprido (a lista de filtros) rola por dentro em vez de a folha
   crescer para fora da tela. `pan-y` deixa a rolagem nativa acontecer sem
   atrapalhar o arraste da folha, que é tratado no JS. */
.folha__conteudo {
  flex: 1 1 auto; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
  overscroll-behavior: contain;
  touch-action: pan-y;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.folha__conteudo::-webkit-scrollbar { width: 0; height: 0; }
/* A ação principal da folha fica sempre ao alcance, mesmo com a lista rolada */
.folha__rodape {
  position: sticky; bottom: 0;
  padding: 10px 0 2px;
  background: linear-gradient(to bottom, rgba(255,255,255,0), var(--superficie) 22%);
}

/* ---------------------------------------------------- 14. BARRA DE ABAS */
.abas {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 55;
  height: calc(var(--altura-tab) + var(--base));
  padding-bottom: var(--base);
  display: flex; align-items: stretch;
  background: var(--vidro); -webkit-backdrop-filter: var(--vidro-blur); backdrop-filter: var(--vidro-blur);
  border-top: 1px solid var(--vidro-borda);
}
.aba {
  flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--texto-2); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.01em;
  transition: color 180ms ease;
  position: relative;
}
.aba svg { width: 24px; height: 24px; transition: transform 240ms cubic-bezier(.3,1.3,.5,1); }
.aba.pressionado svg { transform: scale(0.86); }
.aba[aria-selected="true"] { color: var(--violeta); }
.aba__conta {
  position: absolute; top: 4px; left: calc(50% + 6px);
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px;
  background: var(--alerta); color: #fff; font-size: 0.62rem; font-weight: 900;
  display: grid; place-items: center;
}

/* ------------------------------------------------------- 15. AVALIAÇÕES */
.barra-nota { height: 6px; border-radius: 999px; background: var(--linha); overflow: hidden; flex: 1 1 auto; }
.barra-nota i { display: block; height: 100%; background: var(--dourado); border-radius: 999px; }
.avaliacao { padding: 14px 0; border-bottom: 1px solid var(--linha); }
.avaliacao:last-child { border-bottom: 0; }
.resposta {
  margin-top: 10px; padding: 11px 13px;
  background: var(--violeta-08); border-radius: var(--r-p);
  border-left: 3px solid var(--violeta-claro);
}

/* Seletor de estrelas (avaliar) */
.seletor-estrelas { display: flex; justify-content: center; gap: 6px; }
.seletor-estrelas button { width: 52px; height: 52px; display: grid; place-items: center; color: var(--linha-forte); transition: transform 180ms cubic-bezier(.3,1.4,.5,1), color 160ms ease; }
.seletor-estrelas button svg { width: 40px; height: 40px; }
.seletor-estrelas button[data-on="1"] { color: var(--dourado); }
.seletor-estrelas button.pressionado { transform: scale(1.18); }

/* ------------------------------------------------------ 16. PASSOS (wizard) */
.progresso { display: flex; gap: 5px; padding: 0 18px 4px; }
.progresso i { flex: 1 1 0; height: 4px; border-radius: 999px; background: var(--linha); overflow: hidden; }
.progresso i[data-on="1"] { background: var(--violeta); }
.rodape-fixo {
  flex: none; padding: 12px 18px calc(12px + var(--base));
  background: var(--vidro); -webkit-backdrop-filter: var(--vidro-blur); backdrop-filter: var(--vidro-blur);
  border-top: 1px solid var(--vidro-borda);
  display: flex; gap: 10px; align-items: center;
  position: relative; z-index: 20;
}

/* Seleção múltipla em grade */
.grade-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opcao {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 14px; border-radius: var(--r-m);
  background: var(--superficie); box-shadow: inset 0 0 0 1.5px var(--linha);
  font-weight: 700; font-size: 0.9rem;
  transition: box-shadow 160ms ease, background-color 160ms ease, transform 120ms cubic-bezier(.22,.61,.36,1);
}
.opcao.pressionado { transform: scale(0.975); }
.opcao[aria-pressed="true"] { background: var(--violeta-fundo); box-shadow: inset 0 0 0 2px var(--violeta); color: var(--violeta-escuro); }
.opcao__marca {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1.5px var(--linha-forte); color: transparent;
  transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease;
}
.opcao[aria-pressed="true"] .opcao__marca { background: var(--violeta); color: #fff; box-shadow: none; }

/* Cartão grande de escolha (papel) */
.cartao-escolha {
  display: block; width: 100%; text-align: left;
  padding: 20px; border-radius: var(--r-g);
  background: var(--superficie); box-shadow: var(--sombra-1);
  transition: transform 140ms cubic-bezier(.22,.61,.36,1), box-shadow 200ms ease;
}
.cartao-escolha.pressionado { transform: scale(0.975); }
.cartao-escolha[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--violeta), var(--sombra-2); }

/* ------------------------------------------------------- 17. ESTADOS */
.vazio { padding: 40px 26px; text-align: center; }
.vazio svg { margin: 0 auto 14px; opacity: 0.55; }
.esqueleto {
  background: linear-gradient(100deg, var(--linha) 30%, rgba(43,33,64,0.03) 50%, var(--linha) 70%);
  background-size: 220% 100%; animation: brilho 1.5s linear infinite; border-radius: 8px;
}
@keyframes brilho { to { background-position: -220% 0; } }

/* Aviso flutuante (torrada) */
.torrada {
  position: absolute; left: 16px; right: 16px; bottom: calc(var(--base) + 78px); z-index: 120;
  padding: 13px 16px; border-radius: var(--r-m);
  background: rgba(35, 26, 53, 0.93); color: #fff;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: var(--sombra-3);
  font-size: 0.88rem; font-weight: 700; line-height: 1.4;
  display: flex; align-items: center; gap: 10px;
  will-change: transform, opacity;
}

/* Diálogo modal */
.cortina { position: absolute; inset: 0; z-index: 130; background: rgba(23, 17, 31, 0.42); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: grid; place-items: center; padding: 26px; }
.dialogo { width: 100%; max-width: 320px; background: var(--superficie); border-radius: var(--r-g); padding: 22px; box-shadow: var(--sombra-3); text-align: center; will-change: transform, opacity; }

/* Entrada: bloco central + texto legal ancorado embaixo, em vez de tudo
   empilhado no topo com um vazio de meia tela. */
.entrada { display: flex; flex-direction: column; height: 100%; padding: 0 22px; }
.entrada__meio { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; text-align: center; padding-top: var(--topo); }
.entrada__rodape { flex: none; padding-bottom: calc(var(--base) + 14px); }

/* -------------------------------------------------------- 18. SPLASH */
.splash {
  position: absolute; inset: 0; z-index: 150;
  display: grid; place-items: center;
  background: linear-gradient(168deg, #6A4A9E 0%, #4A2F7B 52%, #35205C 100%);
  color: #fff;
  overflow: hidden;
}
.splash__aura { position: absolute; width: 150%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(232,223,246,0.30) 0%, rgba(232,223,246,0) 62%); }
.splash__conteudo { position: relative; text-align: center; padding: 0 34px; }
.splash h1 { color: #fff; margin-bottom: 10px; }
.splash p { color: rgba(255,255,255,0.82); }

.lotus { margin: 0 auto 22px; width: max-content; }
.lotus svg { margin: 0 auto; }

/* --------------------------------------------- 19. PREFERÊNCIAS DO SISTEMA */

/* Movimento reduzido: troca deslize/mola por dissolução curta. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 120ms !important;
  }
  .pin__anel, .eu__halo { animation: none !important; }
}

/* Transparência reduzida: o vidro vira superfície opaca. */
@media (prefers-reduced-transparency: reduce) {
  .vidro, .vidro--espesso, .busca, .abas, .redondo--vidro, .cabecalho--vidro, .rodape-fixo, .torrada {
    -webkit-backdrop-filter: none !important; backdrop-filter: none !important;
    background: var(--superficie) !important;
  }
  .torrada { background: #231A35 !important; }
  .cortina { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}

/* Mais contraste: fundo quase sólido e borda definida. */
@media (prefers-contrast: more) {
  :root { --texto-2: #5C5474; --texto-3: #6E6688; --linha: rgba(43,33,64,0.22); --linha-forte: rgba(43,33,64,0.4); }
  .cartao, .chip, .redondo { box-shadow: 0 0 0 1px var(--linha-forte); }
  .busca, .abas { background: #fff !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}

/* Utilidades */
.esconde { display: none !important; }
.so-leitor { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.pl { padding-left: 18px; } .pr { padding-right: 18px; }
.mt4 { margin-top: 4px; } .mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; } .mt24 { margin-top: 24px; }
.mb8 { margin-bottom: 8px; } .mb12 { margin-bottom: 12px; } .mb16 { margin-bottom: 16px; } .mb24 { margin-bottom: 24px; }
.cresce { flex: 1 1 auto; min-width: 0; }
.centro { text-align: center; }
.gap6 { gap: 6px; } .gap10 { gap: 10px; }
.enrola { display: flex; flex-wrap: wrap; gap: 6px; }
</style>

/* ============================================================================
   02-fisica.js — o motor de movimento
   Molas interrompíveis, projeção de momento, rubber-banding e rastreio de
   velocidade. Nenhuma dependência externa.

   Por que mola e não transição CSS: uma transição de duração fixa não pode ser
   agarrada no meio do voo e revertida — ela precisa terminar primeiro. Uma mola
   parte sempre do valor que está na tela e aceita um alvo novo a qualquer
   quadro, carregando a velocidade junto. É isso que deixa a interface agarrável.
   ========================================================================= */
const Fisica = (() => {

  /* ------------------------------------------------------------ relógio */
  // Um único requestAnimationFrame para tudo. Mais barato que um por animação,
  // e garante que todas as molas avancem com o MESMO dt (nada desanda).
  const inscritos = new Set();
  let rodando = false;
  let tAnterior = 0;

  function quadro(t) {
    const dt = tAnterior ? Math.min((t - tAnterior) / 1000, 1 / 20) : 1 / 60;
    tAnterior = t;
    for (const fn of Array.from(inscritos)) fn(dt, t);
    if (inscritos.size) requestAnimationFrame(quadro);
    else { rodando = false; tAnterior = 0; }
  }

  function inscrever(fn) {
    inscritos.add(fn);
    if (!rodando) { rodando = true; requestAnimationFrame(quadro); }
    return () => inscritos.delete(fn);
  }

  /* -------------------------------------------------------------- mola */
  /*
     Parâmetros no vocabulário da Apple, não no da física:
       amortecimento (damping ratio) — 1.0 assenta sem passar do ponto;
                                       ~0.8 dá um leve repique.
       resposta (response, em segundos) — quão rápido chega ao alvo.
                                          NÃO é duração: a mola não tem duração.

     Valores que a Apple usa (Designing Fluid Interfaces, WWDC18):
       mover/reposicionar  1.0 / 0.4
       rotação             0.8 / 0.4
       gaveta (sheet)      0.8 / 0.3
  */
  class Mola {
    constructor(opcoes = {}) {
      this.amortecimento = opcoes.amortecimento ?? 1.0;
      this.resposta      = opcoes.resposta ?? 0.4;
      this.valor         = opcoes.valor ?? 0;
      this.alvo          = opcoes.alvo ?? this.valor;
      this.velocidade    = opcoes.velocidade ?? 0;
      this.epsilonV      = opcoes.epsilonV ?? 0.4;
      this.epsilonX      = opcoes.epsilonX ?? 0.15;
      this.aoAtualizar   = opcoes.aoAtualizar || null;
      this.aoParar       = opcoes.aoParar || null;
      this.parada        = true;
      this._solta        = null;
    }

    /* Redefine o alvo SEM zerar a velocidade — é isso que evita a "parede"
       quando o usuário inverte o gesto no meio do movimento. */
    para(alvo, opcoes = {}) {
      this.alvo = alvo;
      if (opcoes.velocidade !== undefined) this.velocidade = opcoes.velocidade;
      if (opcoes.amortecimento !== undefined) this.amortecimento = opcoes.amortecimento;
      if (opcoes.resposta !== undefined) this.resposta = opcoes.resposta;
      this._ligar();
      return this;
    }

    /* Coloca o valor na mão do usuário (arraste 1:1): a mola para de integrar
       e passa a apenas refletir o dedo. */
    fixa(valor, velocidade = 0) {
      this.valor = valor;
      this.velocidade = velocidade;
      this._desligar();
      if (this.aoAtualizar) this.aoAtualizar(this.valor, this.velocidade);
      return this;
    }

    congela() { this._desligar(); return this; }

    _ligar() {
      if (this._solta) return;
      this.parada = false;
      this._solta = inscrever((dt) => this._passo(dt));
    }
    _desligar() {
      if (this._solta) { this._solta(); this._solta = null; }
      this.parada = true;
    }

    _passo(dt) {
      const w = (2 * Math.PI) / this.resposta;   // frequência natural
      const z = this.amortecimento;

      // Integração em subpassos: com dt grande (aba trocada, celular travando)
      // o Euler semi-implícito explode. 1/240 s mantém estável em qualquer caso.
      const passos = Math.max(1, Math.ceil(dt / (1 / 240)));
      const h = dt / passos;
      for (let i = 0; i < passos; i++) {
        const a = -w * w * (this.valor - this.alvo) - 2 * z * w * this.velocidade;
        this.velocidade += a * h;
        this.valor += this.velocidade * h;
      }

      const perto = Math.abs(this.valor - this.alvo) < this.epsilonX;
      const lento = Math.abs(this.velocidade) < this.epsilonV;
      if (perto && lento) {
        this.valor = this.alvo;
        this.velocidade = 0;
        this._desligar();
        if (this.aoAtualizar) this.aoAtualizar(this.valor, 0);
        if (this.aoParar) this.aoParar(this.valor);
        return;
      }
      if (this.aoAtualizar) this.aoAtualizar(this.valor, this.velocidade);
    }
  }

  /* ------------------------------------------------ projeção de momento */
  /*
     Para onde o dedo estava MANDANDO a coisa — não onde ele soltou.
     É a mesma decaída exponencial da rolagem do iOS. A fórmula de livro
     (v²/2a) não é a que a Apple usa; esta é a do código de exemplo do WWDC.
       taxa 0.998 = rolagem normal · 0.99 = mais curto, mais seco
  */
  function projetar(velocidade, taxa = 0.998) {
    return (velocidade / 1000) * taxa / (1 - taxa);
  }

  /* ------------------------------------------------------ rubber-banding */
  /*
     Passou do limite? Continua seguindo o dedo, mas cada vez menos.
     Parar duro lê como "travou"; resistir progressivamente lê como
     "responde, mas acabou".
  */
  function elastico(excesso, dimensao, c = 0.55) {
    return (excesso * dimensao * c) / (dimensao + c * Math.abs(excesso));
  }

  /* Aplica o elástico a um valor fora de [min, max]. */
  function limitarElastico(valor, min, max, dimensao) {
    if (valor < min) return min - elastico(min - valor, dimensao);
    if (valor > max) return max + elastico(valor - max, dimensao);
    return valor;
  }

  /* --------------------------------------------- rastreador de velocidade */
  /*
     A velocidade do último par de eventos é ruidosa (dt de 2ms vira 3000px/s).
     Média sobre uma janela curta de amostras dá o número que o dedo realmente
     tinha na hora de soltar.
  */
  class Rastreador {
    constructor(janelaMs = 90) { this.janela = janelaMs; this.amostras = []; }
    limpar() { this.amostras.length = 0; }
    anota(x, y, t = performance.now()) {
      this.amostras.push({ x, y, t });
      const corte = t - this.janela * 2;
      while (this.amostras.length > 2 && this.amostras[0].t < corte) this.amostras.shift();
    }
    velocidade() {
      const a = this.amostras;
      if (a.length < 2) return { x: 0, y: 0 };
      const fim = a[a.length - 1];
      let ini = a[0];
      for (let i = a.length - 1; i >= 0; i--) {
        if (fim.t - a[i].t > this.janela) break;
        ini = a[i];
      }
      const dt = (fim.t - ini.t) / 1000;
      if (dt <= 0.001) return { x: 0, y: 0 };
      return { x: (fim.x - ini.x) / dt, y: (fim.y - ini.y) / dt };
    }
  }

  /* ------------------------------------------------------------ apoios */
  const limitar = (v, min, max) => (v < min ? min : v > max ? max : v);
  const misturar = (a, b, t) => a + (b - a) * t;

  /* Escolhe o ponto de encaixe mais próximo do lugar PROJETADO — não do lugar
     onde o dedo soltou. É o que faz um peteleco parecer um arremesso. */
  function encaixeMaisProximo(pontos, projetado) {
    let melhor = pontos[0], dist = Infinity;
    for (const p of pontos) {
      const d = Math.abs(p - projetado);
      if (d < dist) { dist = d; melhor = p; }
    }
    return melhor;
  }

  /* O usuário pediu menos movimento? Então nada de mola nem deslize. */
  const menosMovimento = () =>
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  return {
    Mola, Rastreador,
    projetar, elastico, limitarElastico, encaixeMaisProximo,
    inscrever, limitar, misturar, menosMovimento,
  };
})();

  /* ------------------------------- do plano cartesiano para o mundo real
     O protótipo nasceu num plano (120 px = 1 km) porque não havia mapa de
     verdade. Com mapa real o que vale é latitude e longitude — e as duas vistas
     têm de concordar, senão o mesmo pino cai numa esquina no mapa desenhado e
     noutra no mapa real, e ninguém percebe até alguém comparar.

     Por isso a conversão mora AQUI, uma vez só, e é usada pelo mapa desenhado,
     pelo mapa real e pelo gerador da semente do banco.

     ⚠️ As coordenadas preservam DISTÂNCIA e direção, ancoradas em Higienópolis.
     Não são os endereços reais dos bairros citados — as pessoas são fictícias e
     os endereços também. */
  const ANCORA = { lat: -30.01382, lng: -51.18227 };   // Higienópolis, Porto Alegre
  const KM_POR_GRAU_LAT = 111.32;
  const KM_POR_GRAU_LNG = KM_POR_GRAU_LAT * Math.cos((ANCORA.lat * Math.PI) / 180);

  function paraLatLng(x, y) {
    return {
      lat: +(ANCORA.lat - ((y - EU.y) / MUNDO.pxPorKm) / KM_POR_GRAU_LAT).toFixed(6),
      lng: +(ANCORA.lng + ((x - EU.x) / MUNDO.pxPorKm) / KM_POR_GRAU_LNG).toFixed(6),
    };
  }

  /* Distância real em km. No plano dava para usar Pitágoras; sobre a esfera,
     não — e a diferença aparece justamente nas terapeutas mais longe, que são
     as que o filtro de distância vai cortar. */
  function distanciaEntre(a, b) {
    const R = 6371;
    const rad = (g) => (g * Math.PI) / 180;
    const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
    const h = Math.sin(dLat / 2) ** 2
            + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  function paraPlano(lat, lng) {
    return {
      x: EU.x + (lng - ANCORA.lng) * KM_POR_GRAU_LNG * MUNDO.pxPorKm,
      y: EU.y - (lat - ANCORA.lat) * KM_POR_GRAU_LAT * MUNDO.pxPorKm,
    };
  }


  /* ------------------------------------------- derivados (nunca à mão) */
  // Nota média, total de avaliações e faixa de preço são CALCULADOS, como manda
  // o arquivo 03 ("nota média sempre calculada, nunca editável à mão").
  TERAPEUTAS.forEach((t) => {
    const notas = t.avaliacoes.map((a) => a.nota);
    t.total = notas.length;
    t.nota = notas.length ? Math.round((notas.reduce((s, n) => s + n, 0) / notas.length) * 10) / 10 : 0;
    const valores = t.servicos.map((s) => s.valor);
    t.precoMin = Math.min(...valores);
    t.precoMax = Math.max(...valores);
    // A coordenada REAL é o que está escrito; o plano do mapa desenhado é
    // derivado dela. Era o contrário até o mapa de ruas entrar — e aí o bairro
    // escrito deixou de bater com o lugar onde o pino caía.
    Object.assign(t, paraPlano(t.lat, t.lng));

     tela de mostrar "2,9 km" para quem está a 400 km. */
  function recalcularDistancias() {
    TERAPEUTAS.forEach((t) => {
      t.distanciaKm = Math.round(distanciaEntre(EU, t) * 10) / 10;
    });

    if (cidade !== undefined) EU.cidade = cidade;
    Object.assign(EU, paraPlano(lat, lng));   // o mapa desenhado vive no plano
    recalcularDistancias();

    ],

    // Números do painel da terapeuta (fictícios, só para mostrar o formato)

  /* ---------------------------------------------------------- horário */
  function agora() {
    if (estado.relogio) {
      const d = new Date();
      d.setHours(estado.relogio.hora, estado.relogio.minuto, 0, 0);
      // desloca o dia da semana sem mudar o resto
      const delta = estado.relogio.dia - d.getDay();
      d.setDate(d.getDate() + delta);
      return d;
    }
    return new Date();
  }

  const emMinutos = (hhmm) => {
    const [hh, mm] = hhmm.split(':').map(Number);
    return hh * 60 + mm;
  };

  /* "Aberta agora" é calculado no app comparando o relógio com a tabela de
     horários do dia — exatamente como descreve o arquivo 02. */
  function estaAberta(terapeuta, quando = agora()) {
    const dia = quando.getDay();
    const min = quando.getHours() * 60 + quando.getMinutes();
    return terapeuta.horarios.some((h) => h.dia === dia && min >= emMinutos(h.abre) && min < emMinutos(h.fecha));
  }

  /* Se está fechada, quando abre de novo? Serve para escrever a verdade
     ("abre amanhã às 9h") em vez de só dizer "fechada". */
  function proximaAbertura(terapeuta, quando = agora()) {
    const diaHoje = quando.getDay();
    const min = quando.getHours() * 60 + quando.getMinutes();
    for (let i = 0; i < 8; i++) {
      const dia = (diaHoje + i) % 7;
      const doDia = terapeuta.horarios.filter((h) => h.dia === dia).sort((a, b) => emMinutos(a.abre) - emMinutos(b.abre));
      for (const h of doDia) {
        if (i > 0 || emMinutos(h.abre) > min) {
          return { emDias: i, dia, abre: h.abre };
        }
      }
    }
    return null;
  }

  function horariosPorDia(terapeuta) {
    return DIAS.map((_, dia) => ({
      dia,
      faixas: terapeuta.horarios.filter((h) => h.dia === dia).sort((a, b) => emMinutos(a.abre) - emMinutos(b.abre)),
    }));
  }

  /* ----------------------------------------------------------- filtro */
  function listar() {
    const f = estado.filtros;
    const busca = estado.busca.trim().toLowerCase();
    return TERAPEUTAS
      .filter((t) => t.ativa)
      .filter((t) => {
        if (busca) {
          const alvo = (t.nome + ' ' + t.terapias.join(' ') + ' ' + t.bairro + ' ' + t.cidade).toLowerCase();
          if (!alvo.includes(busca)) return false;
        }
        if (f.terapias.size && !t.terapias.some((x) => f.terapias.has(x))) return false;
        if (f.precoMax && t.precoMin > f.precoMax) return false;
        if (f.notaMin && t.nota < f.notaMin) return false;
        if (f.abertaAgora && !estaAberta(t)) return false;
        if (f.online && !t.atendimento.includes('online')) return false;
        return true;
      })
      .sort((a, b) => a.distanciaKm - b.distanciaKm);
  }

  function filtrosAtivos() {
    const f = estado.filtros;
    return f.terapias.size + (f.precoMax ? 1 : 0) + (f.notaMin ? 1 : 0) + (f.abertaAgora ? 1 : 0) + (f.online ? 1 : 0);
  }

  const porId = (id) => TERAPEUTAS.find((t) => t.id === id);

  /* -------------------------------------------------------- formatação */
  const brl = (v) => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

  function distancia(km) {
    if (km < 1) return Math.round(km * 1000 / 50) * 50 + ' m';
    return km.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' km';
  }

  function haQuanto(dias) {
    if (dias === 0) return 'hoje';
    if (dias === 1) return 'ontem';
    if (dias < 7) return `há ${dias} dias`;
    if (dias < 14) return 'há 1 semana';
    if (dias < 30) return `há ${Math.floor(dias / 7)} semanas`;
    if (dias < 60) return 'há 1 mês';
    return `há ${Math.floor(dias / 30)} meses`;
  }

  function duracao(min) {
    if (min < 60) return `${min} min`;
    const h = Math.floor(min / 60), m = min % 60;
    return m ? `${h}h${String(m).padStart(2, '0')}` : `${h}h`;
  }

  /* Link do WhatsApp igual ao do app real (arquivo 02) */
  function linkZap(terapeuta) {
    const texto = encodeURIComponent(`Olá, ${terapeuta.nome.split(' ')[0]}! Encontrei o seu perfil no app e gostaria de saber sobre um horário.`);
    return `https://wa.me/${terapeuta.whatsapp}?text=${texto}`;
  }

  /* Distribuição de notas (5→1) para o gráfico de barras do perfil */
  function distribuicao(terapeuta) {
    const d = [0, 0, 0, 0, 0];
    terapeuta.avaliacoes.forEach((a) => { d[5 - a.nota]++; });
    return d;
  }

  return {
    MUNDO, EU, TERAPIAS, DIAS, DIAS_CURTO, TERAPEUTAS, estado,
    ANCORA, paraLatLng, paraPlano, distanciaEntre,
    definirPosicao, restaurarPosicaoFicticia, recalcularDistancias, POSICAO_FICTICIA,
    agora, estaAberta, proximaAbertura, horariosPorDia, emMinutos,
    listar, filtrosAtivos, porId, distribuicao,
    brl, distancia, haQuanto, duracao, linkZap,
  };
})();

/* ============================================================================
   04-mapa.js — o mapa estilizado e os gestos
   O traçado é gerado por código (sem API de mapas, como pede a Fase 0), num
   estilo claro e dessaturado para o pin violeta saltar aos olhos.
   Os gestos seguem a cartilha da Apple: rastreio 1:1, entrega de velocidade na
   soltura, projeção do momento e resistência elástica na borda.
   ========================================================================= */
const Mapa = (() => {

  /* -------------------------------------------- gerador determinístico */
  // Mesma semente = mesmo mapa, sempre. Um mapa que muda a cada abertura
  // destrói a memória espacial de quem está testando.
  function semente(s) {
    return function () {
      s |= 0; s = (s + 0x6D2B79F5) | 0;
      let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* Os rótulos de bairro do mapa desenhado saem dos PRÓPRIOS DADOS.

     Antes eram uma lista à parte, com coordenadas cravadas no plano. Quando as
     terapeutas ganharam coordenada real, a lista ficou apontando para o lugar
     errado — e como é só decoração, ninguém teria percebido. Derivar da fonte
     única resolve isso de uma vez: mudou a terapeuta de bairro, o rótulo segue. */
  function bairrosDoMapa() {
    const vistos = new Map();
    const por = (nome, lat, lng) => { if (nome && !vistos.has(nome)) vistos.set(nome, { nome, lat, lng }); };
    por(Dados.EU.bairro, Dados.EU.lat, Dados.EU.lng);
    Dados.TERAPEUTAS.forEach((t) => {
      // Em cidade da região metropolitana o nome útil é o da CIDADE, não o do
      // bairro: "Vila Betânia" não localiza ninguém; "Cachoeirinha", sim.
      const nome = t.cidade === Dados.EU.cidade ? t.bairro : t.cidade;
      por(nome, t.lat, t.lng);
    });
    return Array.from(vistos.values());
  }

  /* ------------------------------------------------------ desenho do mapa */
  // `sufixo` existe porque a mesma malha aparece em vários lugares ao mesmo
  // tempo (mapa grande + mini-mapas). Sem ele, dois <mask> teriam o mesmo id.
  function gerarSVG(sufixo = '') {
    const { largura: L, altura: A } = Dados.MUNDO;
    const r = semente(20260823);
    const p = [];
    const idMascara = 'terraFirme' + sufixo;

    p.push(`<svg class="mapa__svg" width="${L}" height="${A}" viewBox="0 0 ${L} ${A}" aria-hidden="true">`);

    /* A água (o Guaíba a oeste, e um trecho de arroio a nordeste) */
    const margem = [];
    for (let y = -40; y <= A + 40; y += 120) {
      const x = 430 + Math.sin(y / 520) * 210 + Math.sin(y / 170) * 55 + r() * 40;
      margem.push(`${Math.round(x)},${y}`);
    }
    const guaiba = `M -60,-40 L ${margem.join(' L ')} L -60,${A + 40} Z`;

    const arroio = [];
    for (let t = 0; t <= 1.001; t += 0.05) {
      arroio.push(`${Math.round(2050 + t * 1400)},${Math.round(560 - Math.sin(t * 5.2) * 130 - t * 120)}`);
    }

    p.push(`<defs>
      <mask id="${idMascara}">
        <rect width="${L}" height="${A}" fill="#fff"/>
        <path d="${guaiba}" fill="#000"/>
        <polyline points="${arroio.join(' ')}" fill="none" stroke="#000" stroke-width="46" stroke-linecap="round"/>
      </mask>
    </defs>`);

    p.push(`<rect width="${L}" height="${A}" fill="var(--mapa-solo)"/>`);
    p.push(`<path d="${guaiba}" fill="var(--mapa-agua)"/>`);
    p.push(`<polyline points="${arroio.join(' ')}" fill="none" stroke="var(--mapa-agua)" stroke-width="42" stroke-linecap="round"/>`);

    /* Parques e praças */
    const parques = [
      { x: 1780, y: 2140, w: 300, h: 210 },   // Parcão
      { x: 1520, y: 2430, w: 380, h: 260 },   // Redenção-ish
      { x: 2260, y: 1520, w: 240, h: 180 },
      { x: 1420, y: 1180, w: 260, h: 300 },
      { x: 2640, y: 900, w: 320, h: 220 },
      { x: 2860, y: 2260, w: 280, h: 340 },
      { x: 1880, y: 620, w: 220, h: 190 },
    ];
    parques.forEach((q) => {
      p.push(`<rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="${34 + r() * 26}" fill="var(--mapa-parque)" mask="url(#${idMascara})"/>`);
    });

    /* Quadras — um leve contraste sobre o solo dá textura de cidade */
    let ruasV = [], ruasH = [];
    for (let x = 120; x < L; x += 62 + r() * 66) ruasV.push(Math.round(x));
    for (let y = 90; y < A; y += 58 + r() * 70) ruasH.push(Math.round(y));

    const quadras = [];
    for (let i = 0; i < ruasV.length - 1; i++) {
      for (let j = 0; j < ruasH.length - 1; j++) {
        if (r() > 0.44) continue;
        const x0 = ruasV[i] + 6, y0 = ruasH[j] + 6;
        const w = ruasV[i + 1] - ruasV[i] - 12, hh = ruasH[j + 1] - ruasH[j] - 12;
        if (w < 16 || hh < 16) continue;
        quadras.push(`<rect x="${x0}" y="${y0}" width="${w}" height="${hh}" rx="3"/>`);
      }
    }
    p.push(`<g fill="var(--mapa-quadra)" mask="url(#${idMascara})">${quadras.join('')}</g>`);

    /* Malha viária: ruas finas, avenidas grossas, três diagonais */
    const ruas = [], vias = [];
    ruasV.forEach((x, i) => ((i % 5 === 2) ? vias : ruas).push(`M ${x} -30 L ${x} ${A + 30}`));
    ruasH.forEach((y, i) => ((i % 5 === 4) ? vias : ruas).push(`M -30 ${y} L ${L + 30} ${y}`));
    vias.push(`M 700 3400 L 1750 1700 L 1900 -40`);          // uma "Assis Brasil"
    vias.push(`M 520 2600 L 3400 1180`);                      // radial leste
    vias.push(`M 1180 -40 L 2500 1500 L 3400 2050`);          // radial nordeste

    p.push(`<g mask="url(#${idMascara})" fill="none" stroke-linecap="round">`);
    p.push(`<g stroke="var(--mapa-rua)" stroke-width="7">${ruas.map((d) => `<path d="${d}"/>`).join('')}</g>`);
    p.push(`<g stroke="var(--mapa-via)" stroke-width="15">${vias.map((d) => `<path d="${d}"/>`).join('')}</g>`);
    p.push(`</g>`);

    /* Duas pontes cruzando a água, para o traçado não parecer cortado */
    p.push(`<g stroke="var(--mapa-via)" stroke-width="13" stroke-linecap="round">
      <path d="M 250 2180 L 760 2140"/>
      <path d="M 180 1180 L 700 1230"/>
    </g>`);

    p.push(`</svg>`);
    return p.join('');
  }

  function rotulos() {
    return bairrosDoMapa().map((b) => {
      const p = Dados.paraPlano(b.lat, b.lng);
      return `<span class="mapa__rotulo" style="left:${Math.round(p.x)}px;top:${Math.round(p.y) - 34}px">${b.nome}</span>`;
    }).join('');
  }

  /* ------------------------------------------------------------ gestos */
  // 120 px = 1 km. Em z=1 a tela mostraria 3,2 km — perto demais para um mapa
  // cuja graça é ver QUEM ESTÁ NA REGIÃO. Em z=0,45 a tela cobre ~7 km, que é
  // a distância que alguém aceita percorrer para uma sessão.
  const ZOOM_MIN = 0.28, ZOOM_MAX = 2.0, ZOOM_INICIAL = 0.45;

  /* Níveis semânticos, os mesmos nomes do mapa real. O app fala em "região" e
     "pessoa"; cada motor traduz para a sua escala — aqui 0,28–2,0, lá 0–22. */
  const NIVEL = { regiao: 0.45, pessoa: 0.62 };

  function montar(el, op = {}) {
    const mundo = el.querySelector('.mapa__mundo');
    const { largura: L, altura: A } = Dados.MUNDO;

    // Estado da câmera. tx/ty são a translação em pixels de tela; z, a escala.
    let z = op.zoom ?? 1;
    let tx = 0, ty = 0;
    // Área realmente visível: o que sobra entre a busca/chips em cima e a
    // folha embaixo. Centralizar na tela inteira joga o pino atrás dos chips.
    let offsetBaixo = op.offsetBaixo || 0;
    let offsetTopo = op.offsetTopo || 0;

    const molaX = new Fisica.Mola({ amortecimento: 1, resposta: 0.45, aoAtualizar: (v) => { tx = v; pintar(); } });
    const molaY = new Fisica.Mola({ amortecimento: 1, resposta: 0.45, aoAtualizar: (v) => { ty = v; pintar(); } });
    const molaZ = new Fisica.Mola({ amortecimento: 1, resposta: 0.4, valor: z, aoAtualizar: (v) => { z = v; pintar(); } });

    function tela() { return { w: el.clientWidth, h: el.clientHeight }; }

    // Até onde a câmera pode ir sem descolar o mundo da tela
    function limites(zz = z) {
      const { w, h } = tela();
      return {
        minX: Math.min(0, w - L * zz), maxX: 0,
        minY: Math.min(0, h - A * zz), maxY: 0,
      };
    }

    function pintar() {
      mundo.style.transform = `translate3d(${tx}px, ${ty}px, 0) scale(${z})`;
      mundo.style.setProperty('--z', z);
      if (op.aoMover) op.aoMover();
    }

    /* Onde, na tela, está um ponto do mundo? Serve para o card apontar o pin. */
    function paraTela(x, y) { return { x: x * z + tx, y: y * z + ty }; }

    /* Coloca um ponto do PLANO no centro da área visível (descontando a folha) */
    function centralizarPlano(x, y, zAlvo = z, animado = true) {
      const { w, h } = tela();
      const zz = Fisica.limitar(zAlvo, ZOOM_MIN, ZOOM_MAX);
      const alvoX = w / 2 - x * zz;
      const alvoY = offsetTopo + (h - offsetTopo - offsetBaixo) / 2 - y * zz;
      const lim = limites(zz);
      const fx = Fisica.limitar(alvoX, lim.minX, lim.maxX);
      const fy = Fisica.limitar(alvoY, lim.minY, lim.maxY);

      if (!animado || Fisica.menosMovimento()) {
        molaX.fixa(fx); molaY.fixa(fy); molaZ.fixa(zz); pintar();
        return;
      }
      molaX.para(fx); molaY.para(fy); molaZ.para(zz);
    }

    /* A interface que o app usa é a MESMA do mapa real: coordenada de verdade e
       nível com nome. Quem converte para o plano é este motor, aqui dentro. */
    function centralizar(lat, lng, nivel = 'regiao', animado = true) {
      const p = Dados.paraPlano(lat, lng);
      centralizarPlano(p.x, p.y, Math.max(z, NIVEL[nivel] || NIVEL.regiao), animado);
    }

    /* Os pinos do mapa desenhado vivem dentro do mundo; refazer o bloco inteiro
       é barato porque são 12 elementos, e mantém filtro e horário em dia. */
    function atualizarPins() {
      const caixa = el.querySelector('#pins');
      if (caixa) caixa.innerHTML = Telas.pinsHTML();
    }

    function selecionar(id) {
      el.querySelectorAll('.pin').forEach((p) => { p.dataset.sel = (p.dataset.id === id ? '1' : '0'); });
    }

    /* Mesmo contrato do mapa real: o ponto azul se move quando o GPS anda.
       Aqui o raio de precisão vira largura em pixels do plano (120 px = 1 km),
       que é a única escala que este motor conhece. */
    function atualizarEu() {
      const eu = el.querySelector('.eu');
      if (!eu) return;
      eu.style.left = Dados.EU.x + 'px';
      eu.style.top = Dados.EU.y + 'px';
      const alvo = el.querySelector('.precisao');
      if (!alvo) return;
      const m = Dados.EU.precisao || 0;
      const raio = (m / 1000) * Dados.MUNDO.pxPorKm;   // 120 px = 1 km
      if (raio > 11) {
        alvo.dataset.mostrar = '1';
        alvo.style.left = (Dados.EU.x - raio) + 'px';
        alvo.style.top = (Dados.EU.y - raio) + 'px';
        alvo.style.width = (raio * 2) + 'px';
        alvo.style.height = (raio * 2) + 'px';
      } else {
        alvo.dataset.mostrar = '0';
      }
    }

    function definirOffsetBaixo(v) { offsetBaixo = v; }
    function definirOffsetTopo(v) { offsetTopo = v; }

    /* ------------------------------------------------- rastreio do toque */
    const dedos = new Map();
    const rastro = new Fisica.Rastreador(90);
    let arrastando = false, movimentou = false;
    let iniX = 0, iniY = 0, baseTx = 0, baseTy = 0;
    let pinca = null;
    let ultimoToque = { t: 0, x: 0, y: 0 };
    // Com o ponteiro capturado, TODOS os eventos seguintes (inclusive o
    // pointerup) chegam com target = elemento que capturou. Guardar quem foi
    // tocado no pointerdown é a única forma de saber se o dedo caiu num pino.
    let alvoInicial = null;

    function pontoMedio() {
      const ps = Array.from(dedos.values());
      if (ps.length === 1) return { x: ps[0].x, y: ps[0].y, d: 0 };
      const dx = ps[1].x - ps[0].x, dy = ps[1].y - ps[0].y;
      return { x: (ps[0].x + ps[1].x) / 2, y: (ps[0].y + ps[1].y) / 2, d: Math.hypot(dx, dy) };
    }

    el.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      el.setPointerCapture(e.pointerId);
      dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (dedos.size === 1) alvoInicial = e.target;

      // Interromper no meio do voo: a câmera passa a obedecer o dedo a partir
      // do valor que está NA TELA — não do alvo. Sem isso há um salto visível.
      molaX.congela(); molaY.congela(); molaZ.congela();

      if (dedos.size === 1) {
        arrastando = true; movimentou = false;
        iniX = e.clientX; iniY = e.clientY;
        baseTx = tx; baseTy = ty;
        rastro.limpar(); rastro.anota(tx, ty);
        el.classList.add('arrastando');
      } else if (dedos.size === 2) {
        const m = pontoMedio();
        pinca = { d0: m.d, z0: z, x0: m.x, y0: m.y, tx0: tx, ty0: ty };
        movimentou = true;
      }
    });

    el.addEventListener('pointermove', (e) => {
      if (!dedos.has(e.pointerId)) return;
      dedos.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (dedos.size >= 2 && pinca) {
        const m = pontoMedio();
        if (pinca.d0 > 0) {
          const bruto = pinca.z0 * (m.d / pinca.d0);
          const zz = Fisica.limitar(bruto, ZOOM_MIN * 0.8, ZOOM_MAX * 1.15);
          const cx = el.getBoundingClientRect().left;
          const cy = el.getBoundingClientRect().top;
          // Mantém sob os dedos o mesmo ponto do mundo que estava lá no início
          const mundoX = (pinca.x0 - cx - pinca.tx0) / pinca.z0;
          const mundoY = (pinca.y0 - cy - pinca.ty0) / pinca.z0;
          z = zz;
          tx = (m.x - cx) - mundoX * zz;
          ty = (m.y - cy) - mundoY * zz;
          amaciarBordas();
          pintar();
        }
        return;
      }

      if (!arrastando) return;
      const dx = e.clientX - iniX, dy = e.clientY - iniY;
      // Histerese: só vira arraste depois de ~8px, senão todo toque some
      if (!movimentou && Math.hypot(dx, dy) < 8) return;
      movimentou = true;

      tx = baseTx + dx;
      ty = baseTy + dy;
      amaciarBordas();
      rastro.anota(tx, ty);
      pintar();
    });

    /* Fora do limite, o mundo continua seguindo o dedo — só que cada vez
       menos. Parar seco leria como travamento. */
    function amaciarBordas() {
      const lim = limites();
      const { w, h } = tela();
      tx = Fisica.limitarElastico(tx, lim.minX, lim.maxX, w);
      ty = Fisica.limitarElastico(ty, lim.minY, lim.maxY, h);
    }

    function soltar(e) {
      if (!dedos.has(e.pointerId)) return;
      dedos.delete(e.pointerId);

      if (dedos.size === 1 && pinca) {
        // Saiu um dedo da pinça: reancora o arraste no que sobrou, sem pulo
        const ps = Array.from(dedos.values())[0];
        pinca = null;
        arrastando = true; movimentou = true;
        iniX = ps.x; iniY = ps.y; baseTx = tx; baseTy = ty;
        rastro.limpar(); rastro.anota(tx, ty);
        return;
      }
      if (dedos.size > 0) return;

      el.classList.remove('arrastando');
      pinca = null;

      if (!movimentou && arrastando) {
        arrastando = false;
        tratarToque(e);
        return;
      }
      arrastando = false;
      assentar();
    }

    el.addEventListener('pointerup', soltar);
    el.addEventListener('pointercancel', soltar);

    /* Soltou: a câmera continua na velocidade exata do dedo, projeta onde iria
       parar e assenta lá. É a costura entre arrastar e animar. */
    function assentar() {
      const v = rastro.velocidade();
      const lim = limites();
      const destinoX = Fisica.limitar(tx + Fisica.projetar(v.x, 0.994), lim.minX, lim.maxX);
      const destinoY = Fisica.limitar(ty + Fisica.projetar(v.y, 0.994), lim.minY, lim.maxY);
      const zz = Fisica.limitar(z, ZOOM_MIN, ZOOM_MAX);

      const foraDoLimite = tx < lim.minX || tx > lim.maxX || ty < lim.minY || ty > lim.maxY;
      const cfg = foraDoLimite
        ? { amortecimento: 1, resposta: 0.36 }              // volta seca, sem repique
        : { amortecimento: 0.86, resposta: 0.55 };          // arremesso: leve inércia

      molaX.para(destinoX, { velocidade: v.x, ...cfg });
      molaY.para(destinoY, { velocidade: v.y, ...cfg });
      if (zz !== z) molaZ.para(zz, { amortecimento: 1, resposta: 0.3 });
    }

    function tratarToque(e) {
      const agora = performance.now();
      const perto = Math.hypot(e.clientX - ultimoToque.x, e.clientY - ultimoToque.y) < 34;
      const rapido = agora - ultimoToque.t < 300;
      ultimoToque = { t: agora, x: e.clientX, y: e.clientY };

      if (perto && rapido) { ampliarNoPonto(e.clientX, e.clientY, 1.7); return; }

      const pin = alvoInicial && alvoInicial.closest ? alvoInicial.closest('.pin') : null;
      if (pin && op.aoTocarPin) { op.aoTocarPin(pin.dataset.id); return; }
      if (op.aoTocarFundo) op.aoTocarFundo();
    }

    function ampliarNoPonto(clienteX, clienteY, fator) {
      const cx = el.getBoundingClientRect().left, cy = el.getBoundingClientRect().top;
      const px = clienteX - cx, py = clienteY - cy;
      const zz = Fisica.limitar(z * fator, ZOOM_MIN, ZOOM_MAX);
      const mundoX = (px - tx) / z, mundoY = (py - ty) / z;
      const lim = limites(zz);
      molaX.para(Fisica.limitar(px - mundoX * zz, lim.minX, lim.maxX), { amortecimento: 1, resposta: 0.42 });
      molaY.para(Fisica.limitar(py - mundoY * zz, lim.minY, lim.maxY), { amortecimento: 1, resposta: 0.42 });
      molaZ.para(zz, { amortecimento: 1, resposta: 0.42 });
    }

    /* Roda do mouse — no desktop é o gesto natural de zoom */
    el.addEventListener('wheel', (e) => {
      e.preventDefault();
      molaX.congela(); molaY.congela(); molaZ.congela();
      const cx = el.getBoundingClientRect().left, cy = el.getBoundingClientRect().top;
      const px = e.clientX - cx, py = e.clientY - cy;
      const zz = Fisica.limitar(z * Math.exp(-e.deltaY * 0.0016), ZOOM_MIN, ZOOM_MAX);
      const mundoX = (px - tx) / z, mundoY = (py - ty) / z;
      z = zz;
      tx = px - mundoX * zz; ty = py - mundoY * zz;
      const lim = limites();
      tx = Fisica.limitar(tx, lim.minX, lim.maxX);
      ty = Fisica.limitar(ty, lim.minY, lim.maxY);
      pintar();
    }, { passive: false });

    function ajustarZoom(fator) {
      const { w, h } = tela();
      ampliarNoPonto(el.getBoundingClientRect().left + w / 2, el.getBoundingClientRect().top + offsetTopo + (h - offsetTopo - offsetBaixo) / 2, fator);
    }

    return { motor: 'desenhado', centralizar, centralizarPlano, paraTela, atualizarPins, selecionar, atualizarEu,
             definirOffsetBaixo, definirOffsetTopo, ajustarZoom, pintar, destruir() {},
             get zoom() { return z; } };
  }

  return { gerarSVG, rotulos, montar, bairrosDoMapa, ZOOM_INICIAL, NIVEL };
})();
